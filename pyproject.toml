[project]
name = "workflow-dojo"
version = "0.2.0"
description = "LeetCode-style trainer for Claude Code workflow scripts, with a live Claude shell"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "ptyprocess>=0.7",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "websockets>=12"]

[tool.setuptools]
packages = ["dojo"]
